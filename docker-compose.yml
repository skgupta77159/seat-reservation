services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d seat_reservation"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .

    ports:
      - "3000:3000"

    environment:
      PORT: 3000

      DATABASE_URL: postgres://postgres:postgres@postgres:5432/seat_reservation

      ADMIN_TOKEN: change-this-admin-token

      PER_USER_LIMIT: 4

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: